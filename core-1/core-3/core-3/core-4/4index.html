*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Vazirmatn',Tahoma,sans-serif;background:var(--light);color:var(--text);direction:rtl;line-height:1.7;}
.top-bar{background:var(--primary);color:#cbd5e0;font-size:12px;padding:10px 5%;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;}
.back-btn{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:6px 16px;border-radius:8px;text-decoration:none;font-size:12px;}
.hero{background:linear-gradient(135deg,#0f2c5c,#1e4a8a);color:#fff;padding:50px 5% 40px;text-align:center;}
.hero h1{font-size:24px;font-weight:900;margin-bottom:10px;}
.hero p{font-size:14px;opacity:.9;}
.container{max-width:1250px;margin:0 auto;padding:35px 5%;}
.org-panel{background:#fff;border-radius:20px;padding:30px;box-shadow:0 8px 30px rgba(0,0,0,.08);margin-bottom:30px;}
.org-panel h2{color:var(--primary);font-size:20px;margin-bottom:20px;font-weight:800;border-right:4px solid var(--secondary);padding-right:12px;}
.file-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px;}
.file-card{background:var(--light);border:2px solid var(--border);border-radius:12px;padding:18px;cursor:pointer;transition:.3s;}
.file-card:hover{border-color:var(--secondary);transform:translateY(-3px);box-shadow:0 8px 20px rgba(44,123,229,.15);}
.file-card .f-icon{font-size:30px;margin-bottom:10px;display:block;}
.file-card h4{color:var(--primary);font-size:14px;margin-bottom:6px;font-weight:700;}
.file-card p{color:var(--gray);font-size:12px;line-height:1.6;}
.file-status{display:inline-block;background:var(--green);color:#fff;padding:3px 10px;border-radius:15px;font-size:10px;margin-top:8px;font-weight:bold;}
.toast{position:fixed;top:25px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:14px 28px;border-radius:10px;z-index:2000;display:none;font-size:14px;}
footer{background:var(--dark);color:#a0aec0;padding:30px 5%;text-align:center;font-size:13px;margin-top:40px;}
footer .manager{color:var(--accent);font-weight:bold;}
@media(max-width:600px){.file-grid{grid-template-columns:1fr;}}

// ==================== تولید پنل‌ها ====================
function renderPanels() {
    const container = document.getElementById('panelsContainer');
    container.innerHTML = '';
    const urlParams = new URLSearchParams(window.location.search);
    const selectedOrg = urlParams.get('org');
    
    Object.keys(orgs).forEach(key => {
        if (selectedOrg && selectedOrg !== key) return;
        const org = orgs[key];
        const panel = document.createElement('div');
        panel.className = 'org-panel';
        panel.innerHTML = `<h2>${org.icon} ${org.name}</h2><div class="file-grid" id="grid-${key}"></div>`;
        container.appendChild(panel);
        
        const grid = document.getElementById(`grid-${key}`);
        org.files.forEach(file => {
            const card = document.createElement('div');
            card.className = 'file-card';
            card.innerHTML = `<span class="f-icon">${file.icon}</span><h4>${file.name}</h4><p>${file.desc}</p><span class="file-status">فعال</span>`;
            card.onclick = () => showToast(`📁 پرونده «${file.name}» باز شد`, '#10b981');
            grid.appendChild(card);
        });
    });
}

function showToast(msg, color = '#1a2332') {
    const t = document.getElementById('toast');
    t.style.background = color; t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 3000);
}

window.addEventListener('load', renderPanels);
